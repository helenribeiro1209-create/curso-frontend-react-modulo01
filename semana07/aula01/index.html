<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titulos e textos</title>
</head>
<body>
    <!-- Tags de títulos no HTML -->
  <h1>Texto Principal</h1>
  <h2>Titulo Secundário</h2>
  <h3>Texto com grau de importancia moderado</h3>

  <h4>Texto com H4 </h4>
  <H5>Texto com H5 </H5>
  <H6>Texto com H6 </H6>

  <hr />

  <p><strong>Parágrafo</strong> <em>simples</em> de texto. <span>Tag span. </span>Continuaçao da tag p </p>

</body>
</html>
