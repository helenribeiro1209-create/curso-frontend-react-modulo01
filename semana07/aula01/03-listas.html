<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listas</title>
  </head>
  <body>
    <h1>Listas</h1>

    <h3>Ingredientes na despensa</h3>

    <!-- Lista não ordenada -->
    <ul type="disc">
      <li>Arroz</li>
      <li>Feijão</li>
      <li>Café</li>
      <li>Mate</li>
    </ul>
    <h3>Passo a passo - Preparo café</h3>

    <!-- Lista ordenada -->
    <ol type="1" start="6">
      <li>Ferver a água;</li>
      <li>Colocar o pó no coador;</li>
      <li>Despejar a água aos poucos.</li>
    </ol>

    <ul>
      <li>Frutas;</li>
      <li>Carne;</li>
      <li>
        Itens de Limpezas:
        <ul type="square">
          <li>Amaciante;</li>
          <li>Sabão em pó;</li>
        </ul>
      </li>
    </ul>
  </body>
</html>
